<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niagara-Style Launcher — Interactive Mock</title>
<style>
  :root{
    --bg: #0b0d10;
    --surface: #14171b;
    --surface-2: #1b1f24;
    --text: #e8eaed;
    --text-2: #9aa0a6;
    --text-3: #5f6368;
    --accent: oklch(0.75 0.12 210);
    --accent-ink: #06222a;
    --danger: #f28b82;
    --radius: 14px;
    --row-h: 46px;
    --clock-size: 58px;
    --list-size: 16px;
    --dock-count: 5;
    --wave: 1;
    color-scheme: dark;
  }
  [data-theme="light"]{
    --bg: #eef0f3;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --text: #1a1c1e;
    --text-2: #5f6368;
    --text-3: #9aa0a6;
    --accent-ink: #f4feff;
    color-scheme: light;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html,body{ height: 100%; }
  body{
    background:
      radial-gradient(1200px 700px at 70% -10%, rgba(255,255,255,.05), transparent 60%),
      var(--bg);
    font-family: Roboto, "Noto Sans", -apple-system, system-ui, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  button{ font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  /* ---------- studio chrome around the phone ---------- */
  .hint{
    position: fixed; top: 14px; left: 16px; z-index: 50;
    font-size: 11.5px; line-height: 1.6; color: var(--text-2); max-width: 300px;
  }
  .hint b{ color: var(--text); font-weight: 600; }
  .hint .k{ font-family: ui-monospace, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .hint button{
    color: var(--accent); margin-right: 10px; font-size: 11.5px; padding: 3px 8px;
    border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); border-radius: 6px;
  }
  .hint button:hover{ background: color-mix(in oklab, var(--accent) 15%, transparent); }

  /* ---------- phone frame ---------- */
  .phone{
    width: 390px; height: 844px; flex: none;
    border-radius: 34px; padding: 10px;
    background: #000;
    box-shadow: 0 0 0 1px #333a, 0 30px 80px rgba(0,0,0,.55);
    position: relative;
    transform-origin: center center;
  }
  .screen{
    position: relative; width: 100%; height: 100%;
    border-radius: 26px; overflow: hidden;
    background:
      radial-gradient(140% 90% at 80% 110%, color-mix(in oklab, var(--accent) 14%, transparent), transparent 55%),
      radial-gradient(120% 80% at 10% -10%, color-mix(in oklab, var(--accent) 8%, transparent), transparent 50%),
      var(--surface);
    user-select: none;
  }
  .statusbar{
    position: absolute; top: 0; left: 0; right: 0; height: 34px; z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 12.5px; font-weight: 500; color: var(--text-2);
    pointer-events: none;
  }
  .statusbar .icons{ display: flex; gap: 5px; align-items: center; }
  .statusbar svg{ width: 14px; height: 14px; fill: var(--text-2); }

  /* ---------- home list ---------- */
  .home{
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 54px 60px 110px 20px;
    scrollbar-width: none; touch-action: pan-y;
    cursor: default;
  }
  .home::-webkit-scrollbar{ display: none; }
  .date{ font-size: 15px; color: var(--text-2); margin-bottom: 2px; }
  .clock{
    font-size: var(--clock-size); font-weight: 300; letter-spacing: -1px;
    line-height: 1.05; margin-bottom: 14px; font-variant-numeric: tabular-nums;
  }
  .widgets{ margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
  .widget{
    display: flex; align-items: center; gap: 12px;
    background: color-mix(in oklab, var(--surface-2) 72%, transparent);
    border: 1px solid color-mix(in oklab, var(--text) 7%, transparent);
    border-radius: var(--radius); padding: 11px 14px;
  }
  .widget .w-ic{ width: 22px; height: 22px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; }
  .widget .w-main{ flex: 1; min-width: 0; }
  .widget .w-title{ font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .widget .w-sub{ font-size: 11.5px; color: var(--text-2); margin-top: 1px; }
  .widget .w-side{ text-align: right; flex: none; }
  .widget .w-big{ font-size: 20px; font-weight: 300; }
  .pro-chip{
    font-size: 9px; font-weight: 700; letter-spacing: .5px; color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 45%, transparent);
    padding: 2px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1px;
  }
  .usage-bars{ display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .u-row{ display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--text-2); }
  .u-row .u-name{ width: 64px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .u-track{ flex: 1; height: 4px; border-radius: 2px; background: color-mix(in oklab, var(--text) 10%, transparent); overflow: hidden; }
  .u-fill{ height: 100%; border-radius: 2px; background: var(--accent); opacity: .8; }
  .u-min{ width: 34px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

  /* ---------- app rows ---------- */
  .row{
    display: flex; align-items: center; gap: 14px;
    height: var(--row-h); border-radius: 12px; padding: 0 10px 0 0;
    position: relative; cursor: pointer;
    transition: background .15s;
  }
  .row:hover{ background: color-mix(in oklab, var(--text) 5%, transparent); }
  .row:active{ background: color-mix(in oklab, var(--text) 10%, transparent); }
  .row .glyph{
    width: 28px; height: 28px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .row .glyph svg{ width: 26px; height: 26px; border-radius: 7px; }
  .row .glyph .letter{ font-size: 17px; font-weight: 600; color: var(--accent); }
  .row .name{
    font-size: var(--list-size); font-weight: 500; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .count{
    font-size: 11px; color: var(--text-2); background: color-mix(in oklab, var(--text) 12%, transparent);
    min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    padding: 0 5px; flex: none;
  }
  .row .chev{ color: var(--text-3); font-size: 18px; flex: none; }
  .dot{
    position: absolute; left: 30px; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent);
    cursor: pointer; z-index: 2;
  }
  .row.iconed .dot{ left: 41px; }
  .launching{ animation: launch .45s ease forwards; }
  @keyframes launch{
    40%{ transform: scale(1.035); background: color-mix(in oklab, var(--accent) 18%, transparent); }
    100%{ transform: scale(1); }
  }

  /* ---------- wave alphabet rail ---------- */
  .rail{
    position: absolute; right: 0; top: 22%; bottom: 14%; width: 40px; z-index: 5;
    display: flex; flex-direction: column; justify-content: space-between;
    align-items: center; padding: 4px 0; cursor: ns-resize; touch-action: none;
  }
  .rail .rl{
    font-size: 10.5px; font-weight: 600; color: var(--text-2);
    width: 100%; text-align: center; height: 16px; line-height: 16px;
    transition: transform .35s cubic-bezier(.3,.7,.3,1), opacity .35s, color .2s, font-size .2s;
  }
  .rail .rl.passed{
    transform: translateX(calc(9px * var(--wave))) rotate(42deg); opacity: .28;
  }
  .rail .rl.active{
    color: var(--accent); font-size: 15px; font-weight: 700; opacity: 1;
    transform: translateX(4px);
  }
  .rail .rl.dim{ opacity: .18; }
  .magnifier{
    position: absolute; z-index: 40; pointer-events: none; display: none;
    right: 74px; top: 0; transform: translateY(-50%);
    background: var(--surface-2); border: 1px solid color-mix(in oklab, var(--text) 12%, transparent);
    border-radius: 12px; padding: 8px 14px; text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .magnifier .m-l{ font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
  .magnifier .m-apps{ font-size: 11px; color: var(--text-2); margin-top: 3px; white-space: nowrap; }

  /* ---------- corner button ---------- */
  .corner{
    position: absolute; right: 14px; bottom: 14px; z-index: 5;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: color-mix(in oklab, var(--surface-2) 60%, transparent);
    transition: transform .15s, background .15s;
  }
  .corner:hover{ background: color-mix(in oklab, var(--text) 10%, transparent); }
  .corner:active{ transform: scale(.92); }
  .corner .dots{ display: grid; grid-template-columns: repeat(3, 4.5px); gap: 4.5px; }
  .corner .dots i{ width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--text-2); }

  /* ---------- overlays ---------- */
  .overlay{
    position: absolute; inset: 0; z-index: 20; display: none;
    background: color-mix(in oklab, var(--surface) 88%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    flex-direction: column;
  }
  .overlay.open{ display: flex; animation: fadein .18s ease; }
  @keyframes fadein{ from{ opacity: 0; } }
  .overlay.sheet{ justify-content: flex-end; background: rgba(0,0,0,.45); }
  [data-theme="light"] .overlay.sheet{ background: rgba(0,0,0,.3); }
  .sheet-card{
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 18px 20px 30px; max-height: 78%; overflow-y: auto; scrollbar-width: none;
    animation: slideup .25s cubic-bezier(.3,.8,.3,1);
  }
  @keyframes slideup{ from{ transform: translateY(40px); opacity: 0; } }

  .search-head{ display: flex; align-items: center; gap: 10px; padding: 54px 20px 12px; }
  .search-head svg{ width: 18px; height: 18px; stroke: var(--text-2); fill: none; stroke-width: 2; flex: none; }
  #searchInput{
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-size: 19px; font-weight: 400; font-family: inherit; caret-color: var(--accent);
  }
  #searchInput::placeholder{ color: var(--text-3); }
  .search-body{ flex: 1; overflow-y: auto; padding: 4px 20px 30px; scrollbar-width: none; }
  .sec{ font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); margin: 16px 0 4px; }
  .srow{
    display: flex; align-items: center; gap: 14px; padding: 10px 8px;
    border-radius: 10px; cursor: pointer; font-size: 15.5px; font-weight: 500;
  }
  .srow:hover{ background: color-mix(in oklab, var(--text) 6%, transparent); }
  .srow .glyph{ width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; }
  .srow .glyph svg{ width: 24px; height: 24px; border-radius: 6px; }
  .srow .s-sub{ font-size: 12px; color: var(--text-2); font-weight: 400; margin-left: auto; }
  .srow .acts{ display: flex; gap: 6px; margin-left: auto; }
  .srow .acts button{
    width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2);
    display: grid; place-items: center; font-size: 13px; color: var(--text-2);
  }
  .srow .acts button:hover{ color: var(--accent); }
  .empty{ text-align: center; color: var(--text-3); font-size: 13.5px; padding: 40px 0; }

  /* folder popup */
  .folder-pop{
    position: absolute; left: 50%; top: 34%; transform: translate(-50%,-50%); z-index: 30;
    width: 280px; background: var(--surface); border-radius: 20px; display: none;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px color-mix(in oklab, var(--text) 10%, transparent);
    overflow: hidden; animation: pop .22s cubic-bezier(.3,1.4,.4,1);
  }
  @keyframes pop{ from{ transform: translate(-50%,-46%) scale(.9); opacity: 0; } }
  .folder-pop.open{ display: block; }
  .folder-pop .fp-head{ padding: 16px 18px 6px; font-size: 17px; font-weight: 600; }
  .folder-pop .fp-sub{ padding: 0 18px 10px; font-size: 11.5px; color: var(--text-3); }
  .folder-pop .fp-list{ padding: 0 8px 10px; }
  .scrim{ position: absolute; inset: 0; z-index: 25; display: none; }
  .scrim.open{ display: block; }

  /* notifications */
  .notif-card{
    background: var(--surface-2); border-radius: 16px; padding: 13px 15px; margin-bottom: 9px;
    border: 1px solid color-mix(in oklab, var(--text) 7%, transparent);
  }
  .notif-card .n-top{ display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .notif-card .n-top svg{ width: 17px; height: 17px; border-radius: 5px; }
  .notif-card .n-app{ font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: .3px; }
  .notif-card .n-time{ margin-left: auto; font-size: 10.5px; color: var(--text-3); }
  .notif-card .n-title{ font-size: 14px; font-weight: 600; }
  .notif-card .n-text{ font-size: 13px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
  .notif-card .n-acts{ display: flex; gap: 8px; margin-top: 10px; }
  .notif-card .n-acts button{
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    padding: 6px 12px; border-radius: 9px; background: color-mix(in oklab, var(--accent) 12%, transparent);
  }
  .notif-card .n-acts button.ghost{ background: color-mix(in oklab, var(--text) 8%, transparent); color: var(--text-2); }
  .reply-box{ display: none; margin-top: 10px; gap: 8px; }
  .reply-box.open{ display: flex; }
  .reply-box input{
    flex: 1; background: var(--surface); border: 1px solid color-mix(in oklab, var(--text) 14%, transparent);
    border-radius: 10px; padding: 8px 12px; color: var(--text); font: inherit; font-size: 13px; outline: none;
  }
  .reply-box input:focus{ border-color: var(--accent); }
  .reply-box button{ font-size: 12.5px; font-weight: 700; color: var(--accent); padding: 0 8px; }

  /* customize */
  .cust-tabs{ display: flex; gap: 4px; margin: 4px 0 14px; }
  .cust-tabs button{
    flex: 1; padding: 8px 0; border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--text-2);
    background: color-mix(in oklab, var(--text) 5%, transparent);
  }
  .cust-tabs button.on{ background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--accent); }
  .cust-pane{ display: none; }
  .cust-pane.on{ display: block; }
  .ctl{ margin-bottom: 16px; }
  .ctl label{ display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-2); }
  .ctl label output{ color: var(--accent); font-variant-numeric: tabular-nums; }
  .swatches{ display: flex; gap: 10px; }
  .swatch{ width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.on{ border-color: var(--text); transform: scale(1.1); }
  .seg{ display: flex; background: color-mix(in oklab, var(--text) 7%, transparent); border-radius: 10px; padding: 3px; }
  .seg button{ flex: 1; padding: 7px 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .seg button.on{ background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .switch{ position: relative; width: 44px; height: 26px; flex: none; cursor: pointer; }
  .switch input{ display: none; }
  .switch .tr{ position: absolute; inset: 0; border-radius: 13px; background: color-mix(in oklab, var(--text) 18%, transparent); transition: background .2s; }
  .switch .kn{ position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .switch input:checked ~ .tr{ background: var(--accent); }
  .switch input:checked ~ .kn{ transform: translateX(18px); }
  .ctl-row{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .ctl-row .t{ font-size: 13.5px; font-weight: 600; }
  .ctl-row .d{ font-size: 11px; color: var(--text-3); margin-top: 1px; }
  input[type=range]{ width: 100%; accent-color: var(--accent); }

  /* drawer */
  .drawer-head{ display: flex; align-items: center; gap: 10px; padding: 54px 20px 8px; }
  .drawer-head input{
    flex: 1; background: color-mix(in oklab, var(--text) 7%, transparent); border: none; outline: none;
    border-radius: 12px; padding: 11px 16px; color: var(--text); font: inherit; font-size: 15px;
  }
  .drawer-grid{ flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 4px; padding: 14px 16px 40px; scrollbar-width: none; align-content: start; }
  .dapp{ display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 2px; border-radius: 14px; cursor: pointer; }
  .dapp:hover{ background: color-mix(in oklab, var(--text) 6%, transparent); }
  .dapp svg{ width: 44px; height: 44px; border-radius: 12px; }
  .dapp span{ font-size: 10.5px; color: var(--text-2); max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* toast */
  .toast{
    position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(16px);
    background: var(--surface-2); color: var(--text); z-index: 60;
    font-size: 12.5px; font-weight: 500; padding: 9px 16px; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: all .25s; pointer-events: none;
    white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .flash{ position: absolute; inset: 0; z-index: 55; background: var(--accent); opacity: 0; pointer-events: none; }
  .flash.go{ animation: flash .5s ease; }
  @keyframes flash{ 20%{ opacity: .18; } 100%{ opacity: 0; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<div class="hint">
  <button onclick="Mock.openCustomize()">Customize</button>
  <button onclick="Mock.reset()">Reset mock</button><br>
  <b>Swipe list down</b> = search · <b>drag letters</b> (right rail) = wave jump<br>
  <b>tap dot</b> = notifications · <b>right-click list</b> = customize<br>
  <span class="k">/</span> search · <span class="k">Esc</span> close
</div>

<div class="phone" id="phone">
  <div class="screen" id="screen" data-theme="dark">

    <div class="statusbar">
      <span id="sbTime">6:32</span>
      <span class="icons">
        <svg viewBox="0 0 24 24"><path d="M2 20h3v-6H2v6zm5 0h3V9H7v11zm5 0h3V4h-3v16zm5 0h3v-9h-3v9z" opacity=".9"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21l3.5-4.5a5.7 5.7 0 00-7 0L12 21zM5 12.5l2 2.5a7.4 7.4 0 0110 0l2-2.5a10.4 10.4 0 00-14 0zM1.5 8L4 11a14 14 0 0116 0l2.5-3A17.8 17.8 0 001.5 8z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.7 4H8.3L6 6.3V4H4v16h2v-6h9.7l2.3-2.3V6.3L15.7 4z" opacity=".9"/></svg>
        <svg viewBox="0 0 24 24"><path d="M10 6v12a2 2 0 002 2h7a2 2 0 002-2V6a2 2 0 00-2-2h-7a2 2 0 00-2 2zm-6 2v8a2 2 0 002 2h2v-2H6V8h2V6H6a2 2 0 00-2 2z" opacity=".9"/></svg>
      </span>
    </div>

    <div class="home" id="home">
      <div class="date" id="date">Monday, August 31</div>
      <div class="clock" id="clock">6:32</div>
      <div class="widgets" id="widgets"></div>
      <div id="appList"></div>
    </div>

    <div class="rail" id="rail"></div>
    <div class="magnifier" id="magnifier"><div class="m-l" id="mLetter">A</div><div class="m-apps" id="mApps"></div></div>

    <div class="corner" id="corner" title="All apps">
      <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <!-- search overlay -->
    <div class="overlay" id="searchOverlay">
      <div class="search-head">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="searchInput" placeholder="Search apps, contacts, math…" autocomplete="off">
      </div>
      <div class="search-body" id="searchBody"></div>
    </div>

    <!-- drawer -->
    <div class="overlay" id="drawer">
      <div class="drawer-head"><input id="drawerSearch" placeholder="Search all apps" autocomplete="off"></div>
      <div class="drawer-grid" id="drawerGrid"></div>
    </div>

    <!-- notifications sheet -->
    <div class="overlay sheet" id="notifSheet">
      <div class="sheet-card" id="notifCard"></div>
    </div>

    <!-- customize sheet -->
    <div class="overlay sheet" id="custSheet">
      <div class="sheet-card" id="custCard"></div>
    </div>

    <div class="scrim" id="scrim"></div>

    <!-- folder popup -->
    <div class="folder-pop" id="folderPop"></div>

    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
'use strict';

function fmtTime(d){
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  if(!S.h24){ const ap = h>=12?'PM':'AM'; h = h%12||12; return h+':'+m+' '+ap; }
  return String(h).padStart(2,'0')+':'+m;
}

function renderList(){
  const list = $('appList'); list.innerHTML = '';
  const frag = document.createDocumentFragment();
  let prevLetter = null, idx = 0;
  APPS.forEach(app=>{
    const row = document.createElement('div'); row.className = 'row';
    const isFolder = !!app.folder;
    const name = isFolder ? app.folder : app.n;
    const first = name[0].toUpperCase();
    const showIcon = idx < S.dockCount && !isFolder;
    row.dataset.letter = isFolder ? '' : first;
    row.dataset.name = name;
    row.dataset.idx = idx;

    const g = document.createElement('div'); g.className = 'glyph';
    if(showIcon){ g.innerHTML = iconSVG(app.i); row.classList.add('iconed'); }
    else if(!isFolder){ g.innerHTML = '<span class="letter">'+first+'</span>'; }
    else { g.innerHTML = '<span class="letter" style="font-size:20px">▸</span>'; }

    const n = document.createElement('div'); n.className = 'name'; n.textContent = name;
    row.append(g, n);

    if(isFolder){
      const c = document.createElement('div'); c.className = 'count'; c.textContent = app.apps.length;
      const ch = document.createElement('div'); ch.className = 'chev'; ch.textContent = '›'; ch.style.color='var(--text-3)';
      row.append(c, ch);
      row.addEventListener('click', e=>{ e.stopPropagation(); openFolder(app); });
    } else {
      row.addEventListener('click', ()=>launch(name, row));
      if(app.notif){
        const d = document.createElement('div'); d.className = 'dot';
        d.addEventListener('click', e=>{ e.stopPropagation(); openNotifs(app); });
        row.appendChild(d);
      }
    }
    frag.appendChild(row);
    idx++;
  });
  list.appendChild(frag);
  renderRail();
}

let railLetters = [];
function renderRail(){
  const rail = $('rail'); rail.innerHTML = ''; railLetters = [];
  const letters = [...new Set(APPS.filter(a=>!a.folder).map(a=>a.n[0].toUpperCase()))].sort();
  letters.forEach(L=>{
    const el = document.createElement('div'); el.className = 'rl'; el.textContent = L;
    el.dataset.letter = L;
    rail.appendChild(el); railLetters.push(el);
  });
}

let waveAmt = 0, lastScrollTop = 0, lastT = 0;
function updateRail(){
  const home = $('home');
  const st = home.scrollTop;
  // wave amplitude from scroll velocity
  const now = performance.now();
  const dt = Math.max(now - lastT, 8); lastT = now;
  const v = Math.abs(st - lastScrollTop) / dt * 16; lastScrollTop = st;
  waveAmt += ((Math.min(v, 3)) - waveAmt) * 0.12;
  document.documentElement.style.setProperty('--wave', S.wave ? (1 + waveAmt * 0.8).toFixed(2) : 0);

  let active = null;
  const rows = [...document.querySelectorAll('.row')];
  const byLetter = {};
  rows.forEach(r=>{ if(r.dataset.letter && !byLetter[r.dataset.letter]) byLetter[r.dataset.letter] = r; });
  railLetters.forEach(el=>{
    const L = el.dataset.letter;
    const row = byLetter[L];
    if(!row){ el.classList.add('dim'); return; }
    const rel = row.offsetTop - 54 - st;           // distance of this letter's row below viewport top
    const passed = rel < -10;
    el.classList.toggle('passed', passed && S.wave);
    // traveling wave: mid-transition letters swing out the farthest
    if(S.wave && rel >= -10 && rel < 150){
      const t = Math.max(0, 1 - rel / 150);        // 1 at viewport top → 0 further down
      const swing = Math.sin(t * Math.PI) * 10;    // px outward at the crest
      el.style.transform = 'translateX(' + (swing * (1 + waveAmt * 0.6)).toFixed(1) + 'px) rotate(' + (swing * 3.4).toFixed(1) + 'deg)';
      el.style.opacity = '';
    } else {
      el.style.transform = '';
      el.style.opacity = '';
    }
    if(rel <= 60 && rel + row.offsetHeight > 60){ active = L; }
  });
  railLetters.forEach(el=>{
    el.classList.toggle('active', el.dataset.letter === active);
  });
}
$('home').addEventListener('scroll', ()=>requestAnimationFrame(updateRail));

/* letter rail drag = jump + magnifier */
(function(){
  const rail = $('rail'), mag = $('magnifier');
  let dragging = false;
  function letterAtY(y){
    const r = rail.getBoundingClientRect();
    const rel = Math.min(Math.max((y - r.top) / r.height, 0), 0.999);
    const idx = Math.floor(rel * rail.children.length);
    return rail.children[Math.min(idx, rail.children.length-1)];
  }
  function jump(el){
    const L = el.dataset.letter;
    const row = [...document.querySelectorAll('.row')].find(r=>r.dataset.letter===L);
    if(row){ $('home').scrollTo({top: row.offsetTop - 54, behavior:'auto'}); }
    $('mLetter').textContent = L;
    const apps = APPS.filter(a=>!a.folder && a.n[0].toUpperCase()===L).map(a=>a.n);
    $('mApps').textContent = apps.slice(0,3).join(', ') + (apps.length>3?'…':'');
    mag.style.top = (el.getBoundingClientRect().top - $('screen').getBoundingClientRect().top + 8) + 'px';
    mag.style.display = 'block';
  }
  function move(e){
    const el = letterAtY(e.touches ? e.touches[0].clientY : e.clientY);
    if(el) jump(el);
  }
  function end(){ dragging = false; mag.style.display = 'none'; }
  rail.addEventListener('pointerdown', e=>{ dragging = true; rail.setPointerCapture(e.pointerId); move(e); });
  rail.addEventListener('pointermove', e=>{ if(dragging) move(e); });
  rail.addEventListener('pointerup', end);
  rail.addEventListener('pointercancel', end);
})();

/* swipe down on list opens search */
(function(){
  const home = $('home'); let sy = null, sx = null, moved = false;
  home.addEventListener('pointerdown', e=>{ sy = e.clientY; sx = e.clientX; moved = false; });
  home.addEventListener('pointermove', e=>{
    if(sy === null) return;
    const dy = e.clientY - sy, dx = Math.abs(e.clientX - sx);
    if(!moved && dy > 55 && dy > dx * 1.6 && home.scrollTop <= 2){ moved = true; openSearch(); }
  });
  home.addEventListener('pointerup', ()=>{ sy = null; });
  home.addEventListener('contextmenu', e=>{ e.preventDefault(); openCustomize(); });
})();

function launch(name, row){
  if(row){ row.classList.remove('launching'); void row.offsetWidth; row.classList.add('launching'); }
  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
  setTimeout(()=>toast('Would launch “'+name+'” — real build fires an Android intent'), 380);
}

  {h:14, m:30, t:'Design review', loc:'Zoom'},

];
function nextEvent(){
  const d = new Date(), now = d.getHours()*60 + d.getMinutes();
  for(const e of EVENTS){
    const t = e.h*60 + e.m;
    if(t > now) return {e, min: t-now};
  }
  return {e: EVENTS[0], min: 24*60 - now + EVENTS[0].h*60+EVENTS[0].m};
}

}
function safeCalc(q){
  if(!/^[\d\s+\-*/().%]+$/.test(q) || !/\d/.test(q) || !/[+\-*/]/.test(q)) return null;
  try{ const v = Function('"use strict";return ('+q+')')(); return (typeof v === 'number' && isFinite(v)) ? String(Math.round(v*1e6)/1e6) : null; }catch(e){ return null; }
}
function rowHTML(icon, name, sub, extra){
  return `<div class="srow" ${extra||''}><div class="glyph">${icon}</div><div>${name}</div>${sub?`<div class="s-sub">${sub}</div>`:''}</div>`;
}
function renderSearch(q){
  const body = $('searchBody'); q = q.trim(); let html = '';
  const calc = q ? safeCalc(q) : null;
  if(calc !== null){
    html += `<div class="sec">Calculator</div>` + rowHTML('<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#8ab4f8"/><text x="24" y="31" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2b3a" font-family="Roboto,sans-serif">=</text></svg>', q + ' = ' + calc, 'tap to copy', `onclick="toast('Copied ${calc}')`);
  }
  const ql = q.toLowerCase();
  const apps = APPS.filter(a=>!a.folder && (!q || a.n.toLowerCase().includes(ql)));
  const folders = APPS.filter(a=>a.folder && (!q || a.folder.toLowerCase().includes(ql)));
  if(apps.length || folders.length){
    html += `<div class="sec">Apps</div>`;
    apps.slice(0,6).forEach(a=>{ html += rowHTML(iconSVG(a.i), a.n, '', `onclick="launch('${a.n}')"`); });
    folders.forEach(f=>{ html += rowHTML(iconSVG('folder'), f.folder, f.apps.length+' apps', `onclick="openFolder(APPS.find(x=>x.folder==='${f.folder}'))"`); });
  }
  if(q){
    html += `<div class="sec">Contacts</div>`;
    CONTACTS.filter(c=>c.n.toLowerCase().includes(ql)).forEach(c=>{
      html += `<div class="srow"><div class="glyph"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="24" fill="#5f6368"/><text x="24" y="30" text-anchor="middle" font-size="20" fill="#fff" font-family="Roboto,sans-serif">${c.n[0]}</text></svg></div><div>${c.n}</div><div class="acts"><button title="Call" onclick="toast('Call ${c.n} — ACTION_CALL in real build')">✆</button><button title="Message" onclick="toast('Message ${c.n}')">✉</button></div></div>`;
    });
    html += `<div class="sec">Actions</div>`;
    html += rowHTML('<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#5f6368"/><path d="M14 24h20" stroke="#fff" stroke-width="4"/></svg>', 'Toggle Wi-Fi', 'quick settings tile', `onclick="toast('Toggles Wi-Fi via Settings panel in real build')"`);
    html += `<div class="sec">More</div>`;
    html += rowHTML('<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#8ab4f8" stroke-width="4"/></svg>', `Search “${q}” on the web`, 'google.com', `onclick="toast('Opens browser search in real build')"`);
    html += rowHTML('<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#34a853"/><path d="M15 33V15l18 9-18 9z" fill="#fff"/></svg>', `Search “${q}” in Play Store`, '', `onclick="toast('Deep-links to Play Store search in real build')"`);
  }
  if(!html) html = '<div class="empty">No results — start typing to search apps, contacts and math</div>';
  body.innerHTML = html;
}
$('searchInput').addEventListener('input', e=>renderSearch(e.target.value));

/* ================= folders ================= */
function openFolder(f){
  const pop = $('folderPop');
  pop.innerHTML = `<div class="fp-head">${f.folder}</div><div class="fp-sub">Pop-up folder · Pro opens these from the wave too</div><div class="fp-list" id="fpList"></div>`;
  const fl = pop.querySelector('#fpList');
  f.apps.forEach(key=>{
    const meta = ALL_APP_META[key];
    const r = document.createElement('div'); r.className = 'srow';
    r.innerHTML = `<div class="glyph">${iconSVG(key)}</div><div>${meta.n}</div>`;
    r.addEventListener('click', ()=>{ closeOverlays(); launch(meta.n); });
    fl.appendChild(r);
  });
  $('scrim').classList.add('open');
  pop.classList.add('open');
}
const ALL_APP_META = {};
APPS.filter(a=>!a.folder).forEach(a=>ALL_APP_META[a.i]=a);
DRAWER_EXTRA.forEach(n=>{ ALL_APP_META[DRAWER_ICONS[n]] = {n, i:DRAWER_ICONS[n]}; });

/* ================= notifications ================= */
function openNotifs(app){
  const card = $('notifCard');
  const data = {
    Messages:[
      {title:'Lena', text:'Are we still on for lunch tomorrow?', time:'2m', reply:true},
      {title:'Delivery bot', text:'Your package was dropped off at the front desk.', time:'1h', reply:false},
    ],
    Gmail:[
      {title:'GitHub', text:'[niagara-mock] PR #42 approved — ready to merge', time:'18m', reply:false},
    ],
  }[app.n] || [];
  card.innerHTML = `<div style="display:flex;align-items:center;margin-bottom:12px">
      <b style="font-size:16px">Notifications</b>
      <span style="margin-left:auto;font-size:12px;color:var(--text-3)">${data.length} · from ${app.n}</span>
      <button style="margin-left:12px;color:var(--accent);font-size:12.5px;font-weight:600" onclick="closeOverlays()">Close</button>
    </div>` +
    data.map((n,i)=>`<div class="notif-card">
      <div class="n-top">${iconSVG(app.i)}<span class="n-app">${app.n.toUpperCase()}</span><span class="n-time">${n.time}</span></div>
      <div class="n-title">${n.title}</div><div class="n-text">${n.text}</div>
      <div class="n-acts">
        <button onclick="this.closest('.notif-card').querySelector('.reply-box').classList.add('open');this.nextElementSibling.focus()">Reply</button>
        <input class="rb-focus" style="display:none">
        <button class="ghost" onclick="closeOverlays();launch('${app.n}')">Open</button>
      </div>
      <div class="reply-box"><input placeholder="Reply to ${n.title}…" onkeydown="if(event.key==='Enter')sendReply(this,'${n.title}')"><button onclick="sendReply(this.previousElementSibling,'${n.title}')">Send</button></div>
    </div>`).join('') +
    `<div style="font-size:11px;color:var(--text-3);margin-top:6px">Inline reply from the home screen — Niagara Pro feature, free here.</div>`;
  $('notifSheet').classList.add('open');
}
function sendReply(input, to){
  const v = input.value.trim();
  toast(v ? 'Replied to '+to+' — “'+v.slice(0,28)+'” (RemoteInput in real build)' : 'Type a message first');
  if(v){ input.value=''; input.closest('.notif-card').querySelector('.reply-box').classList.remove('open'); }
}

/* ================= drawer ================= */
function openDrawer(){
  const grid = $('drawerGrid');
  const all = [
    ...APPS.filter(a=>!a.folder).map(a=>({n:a.n, i:a.i})),
    ...DRAWER_EXTRA.map(n=>({n, i:DRAWER_ICONS[n]})),
  ].sort((a,b)=>a.n.localeCompare(b.n));
  grid.innerHTML = '';
  all.forEach(a=>{
    const el = document.createElement('div'); el.className = 'dapp';
    el.innerHTML = iconSVG(a.i) + '<span>'+a.n+'</span>';
    el.addEventListener('click', ()=>{ closeOverlays(); launch(a.n); });
    grid.appendChild(el);
  });
  grid.dataset.all = '1';
  $('drawerSearch').value = '';
  $('drawer').classList.add('open');
}
$('drawerSearch').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.dapp').forEach(d=>{
    d.style.display = d.querySelector('span').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});
$('corner').addEventListener('click', openDrawer);

/* ================= customize ================= */
function openCustomize(){
  $('custCard').innerHTML = `
    <b style="font-size:16px">Customize</b>
    <div style="font-size:11.5px;color:var(--text-3);margin:2px 0 10px">Everything persists to localStorage — same settings model as the real app's SharedPreferences.</div>
    <div class="cust-tabs">
      <button class="on" data-tab="look">Look &amp; feel</button>
      <button data-tab="widgets">Widgets</button>
      <button data-tab="wave">Wave</button>
    </div>
    <div class="cust-pane on" data-pane="look">
      <div class="ctl"><label>Theme</label>
        <div class="seg" id="segTheme">
          <button data-v="dark" class="${S.theme==='dark'?'on':''}">Dark</button>
          <button data-v="light" class="${S.theme==='light'?'on':''}">Light</button>
        </div></div>
      <div class="ctl"><label>Accent</label>
        <div class="swatches">${ACCENTS.map(a=>`<div class="swatch ${S.accent===a.id?'on':''}" data-v="${a.id}" style="background:${a.v}"></div>`).join('')}</div></div>
      <div class="ctl"><label>Clock size <output id="oClock">${S.clockSize}px</output></label>
        <input type="range" min="36" max="76" value="${S.clockSize}" id="rClock"></div>
      <div class="ctl"><label>List text size <output id="oList">${S.listSize}px</output></label>
        <input type="range" min="13" max="19" value="${S.listSize}" id="rList"></div>
      <div class="ctl"><label>Apps with icons <output id="oDock">${S.dockCount}</output></label>
        <input type="range" min="2" max="9" value="${S.dockCount}" id="rDock"></div>
      <div class="ctl-row"><div><div class="t">24-hour clock</div><div class="d">Status bar + home clock</div></div>
        <label class="switch"><input type="checkbox" id="c24" ${S.h24?'checked':''}><span class="tr"></span><span class="kn"></span></label></div>
    </div>
    <div class="cust-pane" data-pane="widgets">
      ${[['wCalendar','Calendar widget','Next event + countdown'],['wWeather','Weather widget','Live temp via Open-Meteo in real build'],['wUsage','Usage breaker','Screen-time bars per app'],['wMedia','Now playing','MediaSession media widget']]
        .map(([k,t,d])=>`<div class="ctl-row"><div><div class="t">${t}</div><div class="d">${d}</div></div>
        <label class="switch"><input type="checkbox" id="sw_${k}" ${S[k]?'checked':''}><span class="tr"></span><span class="kn"></span></label></div>`).join('')}
    </div>
    <div class="cust-pane" data-pane="wave">
      <div class="ctl-row"><div><div class="t">Wave alphabet</div><div class="d">Letters undock and swing out while you scroll</div></div>
        <label class="switch"><input type="checkbox" id="cWave" ${S.wave?'checked':''}><span class="tr"></span><span class="kn"></span></label></div>
      <div style="font-size:12px;color:var(--text-2);line-height:1.6">Drag the left rail to jump between letters — a magnifier shows the target apps, exactly like Niagara's letter scrubbing.</div>
    </div>`;
  // wire
  $('custCard').querySelectorAll('.cust-tabs button').forEach(b=>b.addEventListener('click', ()=>{
    $('custCard').querySelectorAll('.cust-tabs button').forEach(x=>x.classList.remove('on'));
    $('custCard').querySelectorAll('.cust-pane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    $('custCard').querySelector(`[data-pane="${b.dataset.tab}"]`).classList.add('on');
  }));
  $('segTheme').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ S.theme = b.dataset.v; save(); openCustomize(); }));
  $('custCard').querySelectorAll('.swatch').forEach(sw=>sw.addEventListener('click', ()=>{ S.accent = sw.dataset.v; save(); openCustomize(); }));
  $('rClock').addEventListener('input', e=>{ S.clockSize = +e.target.value; $('oClock').textContent = S.clockSize+'px'; save(); });
  $('rList').addEventListener('input', e=>{ S.listSize = +e.target.value; $('oList').textContent = S.listSize+'px'; save(); });
  $('rDock').addEventListener('input', e=>{ S.dockCount = +e.target.value; $('oDock').textContent = S.dockCount; save(); });
  $('c24').addEventListener('change', e=>{ S.h24 = e.target.checked; save(); });
  ['wCalendar','wWeather','wUsage','wMedia'].forEach(k=>{
    $('sw_'+k).addEventListener('change', e=>{ S[k] = e.target.checked; save(); });
  });
  $('cWave').addEventListener('change', e=>{ S.wave = e.target.checked; save(); });
  $('custSheet').classList.add('open');
}
$('scrim').addEventListener('click', closeOverlays);
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeOverlays();
  if(e.key === '/' && !e.target.matches('input')){ e.preventDefault(); openSearch(); }
});

/* ================= settings application ================= */
function applySettings(){
  const screen = $('screen');
  screen.dataset.theme = S.theme;
  document.body.style.background = S.theme==='light' ? '#dfe3e8' : '';
  const a = ACCENTS.find(x=>x.id===S.accent) || ACCENTS[0];
  document.documentElement.style.setProperty('--accent', a.v);
  document.documentElement.style.setProperty('--clock-size', S.clockSize+'px');
  document.documentElement.style.setProperty('--list-size', S.listSize+'px');
  document.documentElement.style.setProperty('--dock-count', S.dockCount);
  renderList(); renderWidgets(); updateRail();
}
function reset(){
  S = {...DEFAULTS}; save();
  toast('Settings reset');
}

/* phone scale to fit viewport */
function fit(){
  const p = $('phone');
  const s = Math.min(1, (window.innerHeight - 40) / 864, (window.innerWidth - 40) / 410);
  p.style.transform = 'scale('+s+')';
}
window.addEventListener('resize', fit);

/* ================= mock API for automated tests ================= */
window.Mock = {
  openSearch, closeOverlays, openCustomize, openDrawer,
  openFolder: name => openFolder(APPS.find(a=>a.folder===name)),
  openNotifs: name => openNotifs({n:name}),
  set: (k,v) => { S[k]=v; save(); },
  state: () => S,
  reset,
  search: q => { openSearch(); $('searchInput').value = q; renderSearch(q); },
};

/* ================= init ================= */
tick(); applySettings(); fit();
setTimeout(updateRail, 100);
</script>
</body>
</html>
